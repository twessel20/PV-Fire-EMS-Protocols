<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#991b1b"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>PVFIRE EMS Protocols</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f4f4f5}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;z-index:5;background:#991b1b;color:white;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}.headrow{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:10px;object-fit:cover;background:white}.brand{font-weight:850;font-size:20px}.sub{font-size:12px;opacity:.9}.status{margin-left:auto;font-size:11px;background:#ffffff22;padding:6px 8px;border-radius:999px}.rolebar{display:flex;gap:8px;margin-top:10px}.rolebtn{flex:1;border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:10px;padding:9px 10px;font-weight:800;font-size:14px}.rolebtn.on{background:white;color:#991b1b}.search{width:100%;margin-top:10px;padding:12px;border:0;border-radius:12px;font-size:16px}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 12px;background:white;border-bottom:1px solid #ddd}.tab{white-space:nowrap;border:0;border-radius:999px;padding:8px 12px;background:#eee}.tab.on{background:#991b1b;color:#fff}.wrap{padding:12px;max-width:800px;margin:auto}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px #0001}.title{font-weight:750;font-size:17px}.meta{font-size:12px;color:#666;margin-top:4px}.detail{display:none}.detail.on{display:block}.list{display:block}.list.off{display:none}.back{border:0;background:#eee;border-radius:9px;padding:9px 12px;margin-bottom:10px}.source{display:inline-block;text-decoration:none;background:#991b1b;color:#fff;border-radius:10px;padding:10px 12px;margin:8px 0 14px}.section{font-weight:850;margin:22px 0 9px;color:#7f1d1d;font-size:15px;letter-spacing:.02em}.line{font-size:16px;line-height:1.48;margin:9px 0}.para{margin:12px 0}.bullet{padding-left:23px;position:relative}.bullet:before{content:'•';position:absolute;left:5px;font-weight:800}.subbullet{padding-left:40px;position:relative}.subbullet:before{content:'◦';position:absolute;left:18px;font-weight:900}.subsub{padding-left:56px;position:relative}.subsub:before{content:'▪';position:absolute;left:34px}.role-note{font-size:12px;background:#eef6ff;border:1px solid #bfdbfe;padding:10px;border-radius:10px;margin:10px 0 14px}.protocol-mode{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:900;padding:10px 12px;border-radius:10px;margin:10px 0 12px}.protocol-mode.bls{background:#e0f2fe;color:#075985;border:1px solid #7dd3fc}.protocol-mode.als{background:#dcfce7;color:#166534;border:1px solid #86efac}.protocol-mode .dot{width:10px;height:10px;border-radius:50%;background:currentColor}.related-box{margin:14px 0;background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:12px}.related-title{font-size:12px;font-weight:900;color:#475569;margin-bottom:8px;text-transform:uppercase;letter-spacing:.03em}.related-link{display:block;border:0;width:100%;text-align:left;background:white;border:1px solid #dbe4ee;border-radius:9px;padding:10px 11px;margin:6px 0;font-weight:750;color:#991b1b}.notice{font-size:12px;background:#fff7ed;border:1px solid #fed7aa;padding:10px;border-radius:10px;margin-bottom:12px}.fav{float:right;border:0;background:none;font-size:22px}.empty{text-align:center;color:#666;padding:30px}.tools-grid{display:grid;gap:12px}.tool-card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 4px #0001}.tool-card h3{margin:0 0 6px;font-size:18px}.tool-note{font-size:13px;color:#475569;line-height:1.45}.tool-disabled{margin-top:10px;background:#fff7ed;border:1px solid #fdba74;color:#9a3412;border-radius:10px;padding:10px;font-size:13px;font-weight:700}.tool-input{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin-top:8px}.tool-btn{width:100%;border:0;border-radius:10px;background:#991b1b;color:#fff;padding:11px 12px;font-weight:800;margin-top:10px}.tool-result{margin-top:10px;background:#f8fafc;border:1px solid #dbe4ee;border-radius:10px;padding:10px}.flag{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:3px 7px;margin:2px 4px 2px 0}.bls{background:#e5e7eb}.als{background:#dcfce7;color:#166534}.mc{background:#fee2e2;color:#991b1b}.footer{color:#777;font-size:11px;text-align:center;padding:24px 12px 90px}.offline{display:none;background:#fff3cd;color:#664d03;padding:7px 12px;text-align:center;font-size:12px}.offline.on{display:block}</style></head><body>
<div id="offline" class="offline">Offline mode — showing the most recently cached protocol set.</div>
<div class="top"><div class="headrow"><div class="logo" style="display:grid;place-items:center;font-weight:900;color:#991b1b">PV</div><div><div class="brand">PVFIRE EMS Protocols</div><div class="sub" id="ver">Field Reference</div></div><div class="status" id="net">Online</div></div><div class="rolebar"><button id="emtBtn" class="rolebtn" onclick="setRole('EMT')">EMT / BLS</button><button id="medicBtn" class="rolebtn" onclick="setRole('PARAMEDIC')">Paramedic / ALS</button></div><input id="q" class="search" placeholder="Search protocols, medications, symptoms…"></div><div id="tabs" class="tabs"></div><main class="wrap"><div id="list" class="list"></div><div id="detail" class="detail"></div><div class="footer">Quick-reference tool. Department protocol source and Medical Control remain authoritative.</div></main><script>
let data=[],cat='All';const cats=['All','Favorites','Medical','Trauma','Procedures','Medications','Guidelines','Appendix','Tools'];let fav=new Set(JSON.parse(localStorage.getItem('pvfdFav')||'[]'));let role=localStorage.getItem('pvfdRole')||'PARAMEDIC';
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function tabs(){document.querySelector('#tabs').innerHTML=cats.map(c=>`<button class="tab ${c===cat?'on':''}" onclick="setCat('${c}')">${c}</button>`).join('')}
function setCat(c){cat=c;tabs();render()}
function setRole(r){role=r;localStorage.setItem('pvfdRole',r);document.querySelector('#emtBtn').classList.toggle('on',r==='EMT');document.querySelector('#medicBtn').classList.toggle('on',r==='PARAMEDIC');if(document.querySelector('#detail').classList.contains('on')&&location.hash)openP(location.hash.slice(1));else render()}
function roleUI(){document.querySelector('#emtBtn').classList.toggle('on',role==='EMT');document.querySelector('#medicBtn').classList.toggle('on',role==='PARAMEDIC')}
function status(){let on=navigator.onLine;document.querySelector('#net').textContent=on?'Online':'Offline';document.querySelector('#offline').classList.toggle('on',!on)}addEventListener('online',status);addEventListener('offline',status);status();
function flags(x){let t=(x.lines||[]).join(' ').toUpperCase(),a=[];if(t.includes('BLS OR ALS'))a.push('<span class="flag bls">BLS OR ALS</span>');if(t.includes('ALS ONLY'))a.push('<span class="flag als">ALS ONLY</span>');if(t.includes('MEDICAL CONTROL'))a.push('<span class="flag mc">MEDICAL CONTROL</span>');return a.join('')}
function displayTitle(x){if(/^Combined\s+/i.test(x.title))return x.title.replace(/^Combined\s+/i,'');return x.title}
const appendixMap={
  '12-lead-ecg-monitoring':['12-lead-ecg-interpretation'],
  'adult-chest-pain-stemi':['12-lead-ecg-interpretation'],
  'adult-stroke':['cincinnati-prehospital-stroke-scale'],
  'childbirth':['apgar-score'],
  'complicated-childbirth':['apgar-score'],
  'neonatal-resuscitation':['apgar-score','pediatric-vital-sign-ranges-by-age'],
  'pediatric-general-airway':['pediatric-vital-sign-ranges-by-age'],
  'pediatric-obstructed-airway':['pediatric-vital-sign-ranges-by-age'],
  'pediatric-wheezing':['pediatric-vital-sign-ranges-by-age'],
  'pediatric-bradycardia':['pediatric-vital-sign-ranges-by-age'],
  'pediatric-tachycardia-narrow-complex':['pediatric-vital-sign-ranges-by-age'],
  'pediatric-tachycardia-wide-complex':['pediatric-vital-sign-ranges-by-age'],
  'pediatric-cardiac-arrest-vf-pulseless-vt':['pediatric-vital-sign-ranges-by-age'],
  'pediatric-cardiac-arrest-asystole-pea':['pediatric-vital-sign-ranges-by-age'],
  'pediatric-brue':['pediatric-vital-sign-ranges-by-age'],
  'combined-pain-control':['pain-scale'],
  'combined-burn':['total-body-surface-area'],
  'lucas-device-procedure':['lucas-device-appendix'],
  'epinephrine-1-100000-push-dose-procedure':['epinephrine-1-100000-push-dose-appendix'],
  'combined-general-trauma':['tcd-destinations'],
  'patient-destination-criteria':['tcd-destinations']
};
function relatedAppendices(x){
  return (appendixMap[x.id]||[]).map(id=>data.find(z=>z.id===id)).filter(Boolean);
}
function relatedAppendixHtml(x){
  let items=relatedAppendices(x);
  if(!items.length)return '';
  return `<div class="related-box"><div class="related-title">Related Appendix</div>${items.map(a=>`<button class="related-link" onclick="openP('${a.id}')">${esc(a.title)}</button>`).join('')}</div>`;
}

function renderTools(){
  document.querySelector('#list').innerHTML=`
    <div class="tools-grid">
      <div class="tool-card">
        <h3>Lidocaine — Adult Cardiac Arrest</h3>
        <div class="tool-note"><b>VF/pulseless VT:</b> PVFIRE calculator uses <b>1.0 mg/kg IV/IO</b> for the initial dose, with <b>no maximum dose cap</b>. Enter weight in pounds or kilograms.</div>
        <input id="lidoWeight" class="tool-input" inputmode="decimal" type="number" min="0" step="0.1" placeholder="Patient weight">
        <select id="lidoUnit" class="tool-input">
          <option value="lb">lb</option>
          <option value="kg">kg</option>
        </select>
        <button class="tool-btn" onclick="calcLido()">Calculate Lidocaine Dose</button>
        <div id="lidoResult" class="tool-result" style="display:none"></div>
        <div class="tool-note" style="margin-top:10px">AHA-based cardiac arrest tool. The 2025 AHA adult cardiac arrest algorithm lists lidocaine 1–1.5 mg/kg IV/IO for the first dose; this calculator intentionally uses the department-selected 1.0 mg/kg value.</div>
      </div>
      <div class="tool-card">
        <h3>Dopamine Infusion Calculator</h3>
        <div class="tool-note">Enter the ordered dose and the actual bag concentration. The calculator will return both pump rate and gravity-drip rate.</div>
        <input id="dopWeight" class="tool-input" inputmode="decimal" type="number" min="0" step="0.1" placeholder="Patient weight">
        <select id="dopWeightUnit" class="tool-input">
          <option value="lb">lb</option>
          <option value="kg">kg</option>
        </select>
        <input id="dopDose" class="tool-input" inputmode="decimal" type="number" min="0" step="0.1" placeholder="Ordered dose (mcg/kg/min)">
        <input id="dopMg" class="tool-input" inputmode="decimal" type="number" min="0" step="0.1" placeholder="Dopamine in bag (mg)">
        <input id="dopMl" class="tool-input" inputmode="decimal" type="number" min="0" step="1" placeholder="Total bag volume (mL)">
        <select id="dopGtt" class="tool-input">
          <option value="10">10 gtt/mL tubing</option>
          <option value="60">60 gtt/mL tubing</option>
        </select>
        <button class="tool-btn" onclick="calcDopamine()">Calculate Dopamine Rate</button>
        <div id="dopResult" class="tool-result" style="display:none"></div>
        <div class="tool-note" style="margin-top:10px"><b>Math used:</b> concentration = total mcg ÷ mL; mL/hr = (mcg/kg/min × kg × 60) ÷ mcg/mL; gtt/min = (mL/hr × drop factor) ÷ 60.</div>
      </div>
    </div>`;
}
function calcLido(){
  const input=document.querySelector('#lidoWeight'),unit=document.querySelector('#lidoUnit'),box=document.querySelector('#lidoResult');
  let w=parseFloat(input.value);
  if(!Number.isFinite(w)||w<=0){box.style.display='block';box.innerHTML='<b>Enter a valid patient weight.</b>';return}
  let kg=unit.value==='lb'?w/2.2046226218:w;
  let dose=kg*1.0;
  box.style.display='block';
  box.innerHTML=`<div style="font-size:13px;color:#475569">Calculated weight</div><div style="font-size:18px;font-weight:800">${kg.toFixed(1)} kg</div><div style="margin-top:8px;font-size:13px;color:#475569">Lidocaine initial dose — 1.0 mg/kg IV/IO</div><div style="font-size:26px;font-weight:900;color:#991b1b">${dose.toFixed(1)} mg</div><div style="margin-top:6px;font-size:12px;color:#475569">No maximum dose cap applied.</div>`;
}
function calcDopamine(){
  const box=document.querySelector('#dopResult');
  const w=parseFloat(document.querySelector('#dopWeight').value);
  const unit=document.querySelector('#dopWeightUnit').value;
  const dose=parseFloat(document.querySelector('#dopDose').value);
  const mg=parseFloat(document.querySelector('#dopMg').value);
  const ml=parseFloat(document.querySelector('#dopMl').value);
  const gtt=parseFloat(document.querySelector('#dopGtt').value);
  if(![w,dose,mg,ml,gtt].every(Number.isFinite)||w<=0||dose<=0||mg<=0||ml<=0){
    box.style.display='block';box.innerHTML='<b>Enter valid values for weight, dose, medication amount, bag volume, and tubing.</b>';return;
  }
  const kg=unit==='lb'?w/2.2046226218:w;
  const mcgPerMl=(mg*1000)/ml;
  const mlHr=(dose*kg*60)/mcgPerMl;
  const gttMin=(mlHr*gtt)/60;
  box.style.display='block';
  box.innerHTML=`<div style="font-size:13px;color:#475569">Calculated weight</div><div style="font-size:18px;font-weight:800">${kg.toFixed(1)} kg</div><div style="margin-top:8px;font-size:13px;color:#475569">Concentration</div><div style="font-size:18px;font-weight:800">${mcgPerMl.toFixed(1)} mcg/mL</div><div style="margin-top:10px;font-size:13px;color:#475569">Pump rate</div><div style="font-size:26px;font-weight:900;color:#991b1b">${mlHr.toFixed(1)} mL/hr</div><div style="margin-top:10px;font-size:13px;color:#475569">Gravity rate — ${gtt} gtt/mL set</div><div style="font-size:26px;font-weight:900;color:#991b1b">${Math.round(gttMin)} gtt/min</div><div style="margin-top:6px;font-size:12px;color:#475569">Unrounded gravity result: ${gttMin.toFixed(2)} gtt/min.</div>`;
}
function render(){
 if(cat==='Tools'){renderTools();return}
 let q=document.querySelector('#q').value.toLowerCase().trim(),a=[];
 if(cat==='Appendix'){
   if(q){
     let matched=data.filter(x=>x.category!=='Appendix'&&(String(x.search||'').includes(q)||(x.aliases||[]).some(z=>String(z).toLowerCase().includes(q))));
     let ids=[...new Set(matched.flatMap(x=>appendixMap[x.id]||[]))];
     a=ids.map(id=>data.find(x=>x.id===id)).filter(Boolean);
     if(!a.length)a=data.filter(x=>x.category==='Appendix'&&(String(x.search||'').includes(q)||(x.aliases||[]).some(z=>String(z).toLowerCase().includes(q))));
   }else{
     const primary=['12-lead-ecg-interpretation','cincinnati-prehospital-stroke-scale','apgar-score','glasgow-coma-scale','lucas-device-appendix','pain-scale','pediatric-vital-sign-ranges-by-age','epinephrine-1-100000-push-dose-appendix','total-body-surface-area','tcd-destinations'];
     a=primary.map(id=>data.find(x=>x.id===id)).filter(Boolean);
   }
 }else{
   a=data.filter(x=>(cat==='All'||(cat==='Favorites'?fav.has(x.id):x.category===cat))&&(!q||String(x.search||'').includes(q)||(x.aliases||[]).some(z=>String(z).toLowerCase().includes(q))));
 }
 document.querySelector('#list').innerHTML=a.length?a.map(x=>`<div class="card" onclick="openP('${x.id}')"><button class="fav" aria-label="favorite" onclick="event.stopPropagation();toggleFav('${x.id}')">${fav.has(x.id)?'★':'☆'}</button><div class="title">${esc(displayTitle(x))}</div><div class="meta">${esc(x.category)} • ${x.updated?`Updated ${esc(x.updated)}`:`2026 source`}</div></div>`).join(''):'<div class="empty">No matching appendix for this topic.</div>'
}
function toggleFav(id){fav.has(id)?fav.delete(id):fav.add(id);localStorage.setItem('pvfdFav',JSON.stringify([...fav]));render()}
function sourceHref(x){if(x.sourceFile)return x.sourceFile;return x.pageUrl||''}
function normText(v){return String(v||'').replace(/\s+/g,' ').trim()}
function sameTitle(a,b){return normText(a).toLowerCase().replace(/[^a-z0-9]+/g,'')===normText(b).toLowerCase().replace(/[^a-z0-9]+/g,'')}
function isHeading(t){
 let u=t.toUpperCase();
 if(/^(ASSESSMENT|INTERVENTIONS|INDICATIONS|CONTRAINDICATIONS|PRECAUTIONS|SIDE EFFECTS|DOSE|DOSES|ROUTE|ROUTES|NOTES|TECHNIQUE|COMPLICATIONS|PROTOCOL USED IN|PROTOCOLS USED IN|PHARMACOLOGY|GENERAL ROUTING|STEMI ROUTING|TRAUMA|GUIDELINES|DOCUMENTATION)\s*:?/.test(u))return true;
 if(t.endsWith(':')&&t.length<70)return true;
 return t.length<60&&/^[A-Z0-9 ()/&.,'\-]+$/.test(t)&&/[A-Z]/.test(t);
}
function tokenize(x){
 let raw=(x.lines||[]).map(normText).filter(Boolean).filter(l=>l.toUpperCase()!=='PLEASANT VALLEY FIRE DEPARTMENT EMS PROTOCOLS'&&!sameTitle(l,x.title));
 let out=[];
 for(let i=0;i<raw.length;i++){
   let l=raw[i];
   if(/^[•▪]$/.test(l)&&raw[i+1]){out.push({level:l==='▪'?2:0,text:normText(raw[++i])});continue}
   if(/^o\s+/i.test(l)){out.push({level:1,text:normText(l.replace(/^o\s+/i,''))});continue}
   if(/^[-•]\s+/.test(l)){out.push({level:0,text:normText(l.replace(/^[-•]\s+/,''))});continue}
   if(/^▪\s+/.test(l)){out.push({level:2,text:normText(l.replace(/^▪\s+/,''))});continue}
   if(/^\d+\.\s+/.test(l)){out.push({level:0,text:l,numbered:true});continue}
   if(isHeading(l)){out.push({heading:true,text:l.replace(/:$/,'')});continue}
   out.push({text:l,plain:true});
 }
 // Join wrapped PDF lines to their preceding logical item.
 let joined=[];
 for(let i=0;i<out.length;i++){
   let t=out[i];
   if(t.heading){joined.push(t);continue}
   if(t.plain){
     if(joined.length&& !joined.at(-1).heading && (joined.at(-1).plain||joined.at(-1).level!==undefined)){joined.at(-1).text=normText(joined.at(-1).text+' '+t.text)}
     else joined.push(t);
   } else {
     joined.push(t);
   }
 }
 return joined;
}
function scopedTokens(x){
 let ts=tokenize(x),scope='shared',result=[];
 for(let i=0;i<ts.length;i++){
   let t=ts[i],u=t.text.toUpperCase();
   if(t.heading){
     // clinical subsection heading resets to shared context unless explicitly ALS-only
     if(!/ALS\s*ONLY/.test(u))scope='shared';
     result.push({...t,scope:'shared'});continue;
   }
   let inlineALS=/\(ALS ONLY\)|^ALS\s*ONLY\b|\bALS\s*ONLY:/.test(u);
   let inlineShared=/^BLS\s+OR\s+ALS\b|\(BLS\s+OR\s+ALS\)/.test(u);
   if(inlineShared){scope='shared';let txt=t.text.replace(/^BLS\s+or\s+ALS\s*:?\s*/i,'').trim();if(txt)result.push({...t,text:txt,scope:'shared'});continue}
   if(inlineALS){
     let txt=t.text.replace(/^ALS\s*ONLY\s*:?\s*/i,'').replace(/\s*\(ALS ONLY\)\s*/ig,'').trim();
     if(txt)result.push({...t,text:txt,scope:'als'});
     // standalone ALS ONLY marker turns following nested items into ALS until next top-level shared item/heading
     if(/^ALS\s*ONLY\s*:?$/i.test(t.text)||/^ALS\s*ONLY\s*:/i.test(t.text)&&!txt)scope='als';
     else if(/^ALS\s*ONLY\s*:?$/i.test(u))scope='als';
     continue;
   }
   if(scope==='als' && t.level===0){
     // A new top-level bullet after nested ALS items resumes shared workflow unless it itself says ALS.
     scope='shared';
   }
   result.push({...t,scope});
 }
 return result;
}
function formatProtocol(x){
 let ts=scopedTokens(x);
 if(role==='EMT')ts=ts.filter(t=>t.heading||t.scope!=='als');
 let rendered=[],lastHeading='';
 for(let i=0;i<ts.length;i++){
   let t=ts[i],text=normText(t.text);
   if(!text)continue;
   if(t.heading){
     lastHeading=text.toUpperCase();
     rendered.push(`<div class="section">${esc(text)}</div>`);
     continue;
   }
   // Medication blocks are lists even when the PDF has no bullets.
   if(x.category==='Medications'&&/^(INDICATIONS|CONTRAINDICATIONS|PRECAUTIONS|SIDE EFFECTS)$/.test(lastHeading)&&t.plain)t.level=0;
   let cls=t.level===2?'subsub':t.level===1?'subbullet':t.level===0?'bullet':'para';
   rendered.push(`<div class="line ${cls}">${esc(text)}</div>`);
 }
 return rendered.join('');
}
function openP(id){
 let x=data.find(z=>z.id===id);if(!x)return;location.hash=id;document.querySelector('#list').classList.add('off');
 let body=formatProtocol(x),src=sourceHref(x),roleText=role==='EMT'?'EMT selected — showing the BLS portion of this protocol.':'Paramedic selected — showing the complete protocol.',modeClass=role==='EMT'?'bls':'als',modeText=role==='EMT'?'BLS PROTOCOL VIEW':'ALS PROTOCOL VIEW';
 document.querySelector('#detail').innerHTML=`<button class="back" onclick="closeP()">‹ Back</button><div class="card"><button class="fav" onclick="toggleFav('${x.id}');openP('${x.id}')">${fav.has(x.id)?'★':'☆'}</button><h2>${esc(displayTitle(x))}</h2><div class="meta">${esc(x.category)} • ${x.updated?`Updated ${esc(x.updated)}`:'2026 PVFIRE EMS Protocols'}</div><div class="protocol-mode ${modeClass}"><span class="dot"></span>${modeText}</div><div class="role-note"><b>${esc(roleText)}</b></div>${relatedAppendixHtml(x)}${src?`<p><a class="source" href="${esc(src)}" target="_blank" rel="noopener">View Source Protocol PDF ↗</a></p>`:''}<div class="notice">Quick-reference display of the PVFIRE source protocol. Use the official source when exact wording, layout, tables, or context are needed.</div><div class="protocol-body">${body}</div></div>`;
 document.querySelector('#detail').classList.add('on');scrollTo(0,0);
}
function closeP(){location.hash='';document.querySelector('#detail').classList.remove('on');document.querySelector('#list').classList.remove('off')}
document.querySelector('#q').addEventListener('input',()=>{if(document.querySelector('#detail').classList.contains('on'))closeP();render()});
async function load(){try{let r=await fetch('protocols.json',{cache:'no-store'});if(!r.ok)throw 0;data=await r.json()}catch(e){let r=await caches.match('protocols.json');if(r)data=await r.json()}tabs();render();let dates=data.map(x=>x.updated).filter(Boolean).sort();document.querySelector('#ver').textContent=`${dates.length?'Current through '+dates.at(-1):'2026'} • Offline-ready`;if(location.hash)openP(location.hash.slice(1))}load();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
