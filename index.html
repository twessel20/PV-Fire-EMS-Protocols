<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#991b1b"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>PVFIRE EMS Protocols</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f4f4f5}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;z-index:5;background:#991b1b;color:white;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}.headrow{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:10px;object-fit:cover;background:white}.brand{font-weight:850;font-size:20px}.sub{font-size:12px;opacity:.9}.status{margin-left:auto;font-size:11px;background:#ffffff22;padding:6px 8px;border-radius:999px}.search{width:100%;margin-top:10px;padding:12px;border:0;border-radius:12px;font-size:16px}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 12px;background:white;border-bottom:1px solid #ddd}.tab{white-space:nowrap;border:0;border-radius:999px;padding:8px 12px;background:#eee}.tab.on{background:#991b1b;color:#fff}.wrap{padding:12px;max-width:800px;margin:auto}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px #0001}.title{font-weight:750;font-size:17px}.meta{font-size:12px;color:#666;margin-top:4px}.detail{display:none}.detail.on{display:block}.list{display:block}.list.off{display:none}.back{border:0;background:#eee;border-radius:9px;padding:9px 12px;margin-bottom:10px}.source{display:inline-block;text-decoration:none;background:#991b1b;color:#fff;border-radius:10px;padding:10px 12px;margin:8px 0 14px}.section{font-weight:800;margin:18px 0 7px;color:#7f1d1d}.line{font-size:15px;line-height:1.42;margin:5px 0}.bullet{padding-left:16px;position:relative}.bullet:before{content:'•';position:absolute;left:2px}.notice{font-size:12px;background:#fff7ed;border:1px solid #fed7aa;padding:10px;border-radius:10px;margin-bottom:12px}.fav{float:right;border:0;background:none;font-size:22px}.empty{text-align:center;color:#666;padding:30px}.flag{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:3px 7px;margin:2px 4px 2px 0}.bls{background:#e5e7eb}.als{background:#dcfce7;color:#166534}.mc{background:#fee2e2;color:#991b1b}.footer{color:#777;font-size:11px;text-align:center;padding:24px 12px 90px}.offline{display:none;background:#fff3cd;color:#664d03;padding:7px 12px;text-align:center;font-size:12px}.offline.on{display:block}</style></head><body>
<div id="offline" class="offline">Offline mode — showing the most recently cached protocol set.</div>
<div class="top"><div class="headrow"><div class="logo" style="display:grid;place-items:center;font-weight:900;color:#991b1b">PV</div><div><div class="brand">PVFIRE EMS Protocols</div><div class="sub" id="ver">Field Reference</div></div><div class="status" id="net">Online</div></div><input id="q" class="search" placeholder="Search protocols, medications, symptoms…"></div><div id="tabs" class="tabs"></div><main class="wrap"><div id="list" class="list"></div><div id="detail" class="detail"></div><div class="footer">Quick-reference tool. Department protocol source and Medical Control remain authoritative.</div></main><script>
let data=[],cat='All';const cats=['All','Favorites','Medical','Trauma','Procedures','Medications','Guidelines','Appendix'];let fav=new Set(JSON.parse(localStorage.getItem('pvfdFav')||'[]'));
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function tabs(){document.querySelector('#tabs').innerHTML=cats.map(c=>`<button class="tab ${c===cat?'on':''}" onclick="setCat('${c}')">${c}</button>`).join('')}
function setCat(c){cat=c;tabs();render()}
function status(){let on=navigator.onLine;document.querySelector('#net').textContent=on?'Online':'Offline';document.querySelector('#offline').classList.toggle('on',!on)}addEventListener('online',status);addEventListener('offline',status);status();
function flags(x){let t=(x.lines||[]).join(' ').toUpperCase(),a=[];if(t.includes('BLS OR ALS'))a.push('<span class="flag bls">BLS OR ALS</span>');if(t.includes('ALS ONLY'))a.push('<span class="flag als">ALS ONLY</span>');if(t.includes('MEDICAL CONTROL'))a.push('<span class="flag mc">MEDICAL CONTROL</span>');return a.join('')}
function render(){let q=document.querySelector('#q').value.toLowerCase().trim();let a=data.filter(x=>(cat==='All'||(cat==='Favorites'?fav.has(x.id):x.category===cat))&&(!q||String(x.search||'').includes(q)||(x.aliases||[]).some(z=>String(z).toLowerCase().includes(q))));document.querySelector('#list').innerHTML=a.length?a.map(x=>`<div class="card" onclick="openP('${x.id}')"><button class="fav" aria-label="favorite" onclick="event.stopPropagation();toggleFav('${x.id}')">${fav.has(x.id)?'★':'☆'}</button><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.category)} • ${x.updated?`Updated ${esc(x.updated)}`:`2026 source`}</div><div>${flags(x)}</div></div>`).join(''):'<div class="empty">No matching protocol found.</div>'}
function toggleFav(id){fav.has(id)?fav.delete(id):fav.add(id);localStorage.setItem('pvfdFav',JSON.stringify([...fav]));render()}
function sourceHref(x){if(x.sourceFile)return x.sourceFile;return x.pageUrl||''}
function openP(id){let x=data.find(z=>z.id===id);if(!x)return;location.hash=id;document.querySelector('#list').classList.add('off');let body=(x.lines||[]).map(l=>{let u=String(l).toUpperCase();let sec=/^(ASSESSMENT|INTERVENTIONS|INDICATIONS|CONTRAINDICATIONS|PRECAUTIONS|SIDE EFFECTS|DOSE|DOSES|ROUTE|ROUTES|NOTES|TECHNIQUE|COMPLICATIONS|PROTOCOL USED IN|PROTOCOLS USED IN|PHARMACOLOGY|GENERAL ROUTING|STEMI ROUTING|TRAUMA)/.test(u);return sec?`<div class="section">${esc(l)}</div>`:`<div class="line ${/^[-•▪o]|^[0-9]+\./.test(l)?'bullet':''}">${esc(String(l).replace(/^[-•▪]\s*/,''))}</div>`}).join('');let src=sourceHref(x);document.querySelector('#detail').innerHTML=`<button class="back" onclick="closeP()">‹ Back</button><div class="card"><button class="fav" onclick="toggleFav('${x.id}');openP('${x.id}')">${fav.has(x.id)?'★':'☆'}</button><h2>${esc(x.title)}</h2><div class="meta">${esc(x.category)} • ${x.updated?`Updated ${esc(x.updated)}`:'2026 PVFIRE EMS Protocols'}</div><div>${flags(x)}</div>${src?`<p><a class="source" href="${esc(src)}" target="_blank" rel="noopener">View Source Protocol PDF ↗</a></p>`:''}<div class="notice">Quick-reference display of the PVFIRE source protocol. Use the official source when exact wording, layout, tables, or context are needed.</div>${body}</div>`;document.querySelector('#detail').classList.add('on');scrollTo(0,0)}
function closeP(){location.hash='';document.querySelector('#detail').classList.remove('on');document.querySelector('#list').classList.remove('off')}
document.querySelector('#q').addEventListener('input',()=>{if(document.querySelector('#detail').classList.contains('on'))closeP();render()});
async function load(){try{let r=await fetch('protocols.json',{cache:'no-store'});if(!r.ok)throw 0;data=await r.json()}catch(e){let r=await caches.match('protocols.json');if(r)data=await r.json()}tabs();render();let dates=data.map(x=>x.updated).filter(Boolean).sort();document.querySelector('#ver').textContent=`${dates.length?'Current through '+dates.at(-1):'2026'} • Offline-ready`;if(location.hash)openP(location.hash.slice(1))}load();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
