function calcLido(){
  const input=document.querySelector('#lidoWeight'),unit=document.querySelector('#lidoUnit'),box=document.querySelector('#lidoResult');
  let w=parseFloat(input.value);
  if(!Number.isFinite(w)||w<=0){box.style.display='block';box.innerHTML='<b>Enter a valid patient weight.</b>';return}
  let kg=unit.value==='lb'?w/2.2046226218:w;
  let dose=kg*1.0;
  box.style.display='block';
  box.innerHTML=`<div style="font-size:13px;color:#475569">Calculated weight</div><div style="font-size:18px;font-weight:800">${kg.toFixed(1)} kg</div><div style="margin-top:8px;font-size:13px;color:#475569">Lidocaine initial dose — 1.0 mg/kg IV/IO</div><div style="font-size:26px;font-weight:900;color:#991b1b">${dose.toFixed(1)} mg</div><div style="margin-top:6px;font-size:12px;color:#475569">No maximum dose cap applied.</div>`;
}
function calcDopamine(){
  const box=document.querySelector('#dopResult');
  const w=parseFloat(document.querySelector('#dopWeight').value);
  const unit=document.querySelector('#dopWeightUnit').value;
  const dose=parseFloat(document.querySelector('#dopDose').value);
  const mg=parseFloat(document.querySelector('#dopMg').value);
  const ml=parseFloat(document.querySelector('#dopMl').value);
  const gtt=parseFloat(document.querySelector('#dopGtt').value);
  if(![w,dose,mg,ml,gtt].every(Number.isFinite)||w<=0||dose<=0||mg<=0||ml<=0){
    box.style.display='block';box.innerHTML='<b>Enter valid values for weight, dose, medication amount, bag volume, and tubing.</b>';return;
  }
  const kg=unit==='lb'?w/2.2046226218:w;
  const mcgPerMl=(mg*1000)/ml;
  const gttMin=(dose*kg*gtt)/mcgPerMl;
  box.style.display='block';
  box.innerHTML=`<div style="font-size:13px;color:#475569">Calculated weight</div><div style="font-size:18px;font-weight:800">${kg.toFixed(1)} kg</div><div style="margin-top:8px;font-size:13px;color:#475569">Concentration</div><div style="font-size:18px;font-weight:800">${mcgPerMl.toFixed(1)} mcg/mL</div><div style="margin-top:10px;font-size:13px;color:#475569">Gravity rate — ${gtt} gtt/mL set</div><div style="font-size:28px;font-weight:950;color:#991b1b">${Math.round(gttMin)} gtt/min</div><div style="margin-top:6px;font-size:12px;color:#475569">Unrounded result: ${gttMin.toFixed(2)} gtt/min.</div>`;
}

function normText(v){return String(v||'').replace(/[■▪◼◾□◆►▶]+/g,' ').replace(/^[•·‣⁃–—-]+\s*/,'').replace(/\s+/g,' ').trim()}
function sameTitle(a,b){return normText(a).toLowerCase().replace(/[^a-z0-9]+/g,'')===normText(b).toLowerCase().replace(/[^a-z0-9]+/g,'')}
function isHeading(t){
 let u=t.toUpperCase();
 if(/^(ASSESSMENT|INTERVENTIONS|INDICATIONS|CONTRAINDICATIONS|PRECAUTIONS|SIDE EFFECTS|DOSE|DOSES|ROUTE|ROUTES|NOTES|TECHNIQUE|COMPLICATIONS|PROTOCOL USED IN|PROTOCOLS USED IN|PHARMACOLOGY|GENERAL ROUTING|STEMI ROUTING|TRAUMA|GUIDELINES|DOCUMENTATION)\s*:?/.test(u))return true;

 return t.length<60&&/^[A-Z0-9 ()/&.,'\-]+$/.test(t)&&/[A-Z]/.test(t);
}
function tokenize(x){
 let raw=(x.lines||[]).map(normText).filter(Boolean)
   .filter(l=>!/^PLEASANT VALLEY FIRE DEPARTMENT EMS PROTOCOLS$/i.test(l)&&!/^PLEASANT VALLEY FIRE DEPARTMENT EMS$/i.test(l)&&!/^PROTOCOLS$/i.test(l)&&!sameTitle(l,x.title));
 raw=raw.filter((l,i)=>!i||normText(l).toLowerCase()!==normText(raw[i-1]).toLowerCase());
 let out=[];
 for(let i=0;i<raw.length;i++){
   let l=raw[i];
   if(/^[•▪]$/.test(l)&&raw[i+1]){out.push({level:l==='▪'?2:0,text:normText(raw[++i]),sourceItem:true});continue}
   if(/^o\s+/i.test(l)){out.push({level:1,text:normText(l.replace(/^o\s+/i,'')),sourceItem:true});continue}
   if(/^[-•]\s+/.test(l)){out.push({level:0,text:normText(l.replace(/^[-•]\s+/,'')),sourceItem:true});continue}
   if(/^▪\s+/.test(l)){out.push({level:2,text:normText(l.replace(/^▪\s+/,'')),sourceItem:true});continue}
   let m=l.match(/^(\d+\.|[a-z]\.|[ivx]+\.)\s+(.*)$/i);
   if(m){let level=/^\d/.test(m[1])?0:/^[a-z]/i.test(m[1])?1:2;out.push({level,text:l,numbered:true,sourceItem:true});continue}
   if(isHeading(l)){out.push({heading:true,text:l.replace(/:$/,'')});continue}
   out.push({text:l,plain:true});
 }
 let joined=[];
 const endsSentence=v=>/[.!?;:]["')\]]?$/.test(v);
 const startsNewItem=v=>/^(?:\d+\.|[a-z]\.|[ivx]+\.|ADULTS?\b|PEDS?\b|PEDIATRIC\b|BLS\b|ALS\b|MUST\b|CONTACT\b|TRANSPORT\b|ASSESSMENT\b|INTERVENTIONS\b|NOTES\b)/i.test(v);
 for(let i=0;i<out.length;i++){
   let t=out[i],prev=joined.at(-1);
   if(t.heading||t.sourceItem){joined.push(t);continue}
   if(t.plain&&prev&&prev.plain&&!prev.heading&&!endsSentence(prev.text)&&!startsNewItem(t.text))prev.text=normText(prev.text+' '+t.text);
   else joined.push(t);
 }
 return joined;
}
function scopedTokens(x){
 let ts=tokenize(x),scope='shared',result=[];
 const sharedRx=/\bBLS\s+(?:OR|OF)\s+ALS\b/i;
 const alsRx=/\bALS\s+ONLY\b|\bALSO\s+ONLY\b/i;
 const resetHeading=u=>/^(ASSESSMENT|INTERVENTIONS|NOTES|SCENE SIZE UP|BODY SUBSTANCE ISOLATION|LOCALIZED COLD INJURY|SYSTEMIC HYPOTHERMIA|PROBABLE PSYCHIATRIC PROBLEM ONLY|AGITATED PATIENTS|MILD ANAPHYLAXIS|ANAPHYLAXIS WITH RESPIRATORY DISTRESS|ANAPHYLACTIC SHOCK)\b/.test(u);
 for(let i=0;i<ts.length;i++){
   let t=ts[i],u=normText(t.text).toUpperCase();
   const sharedMarker=sharedRx.test(t.text),alsMarker=alsRx.test(t.text);
   if(t.heading){
     if(resetHeading(u)||sharedMarker)scope='shared';
     if(alsMarker)scope='als';
     let txt=t.text.replace(/\s*\(?BLS\s+(?:or|of)\s+ALS\)?\s*/ig,' ').trim();
     result.push({...t,text:txt,scope});
     continue;
   }
   if(sharedMarker){
     scope='shared';
     let txt=t.text.replace(/\s*\(?BLS\s+(?:or|of)\s+ALS\)?\s*:?\s*/ig,' ').trim();
     if(txt)result.push({...t,text:txt,scope:'shared'});
     continue;
   }
   if(alsMarker){
     scope='als';
     let txt=t.text.replace(/\s*\(?ALS\s+ONLY\)?\s*:?\s*/ig,' ').replace(/\s*\(?ALSO\s+ONLY\)?\s*:?\s*/ig,' ').trim();
     if(txt)result.push({...t,text:txt,scope:'als'});
     continue;
   }
   result.push({...t,scope});
 }
 return result;
}

   let parts=[t];

 }

 let ts=scopedTokens(x);

 let rendered=[],lastHeading='';
 for(let i=0;i<ts.length;i++){
