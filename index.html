function patientMedTrim(v,max=1300){
 const s=Array.isArray(v)?v.join('\n\n'):String(v||'');

}
async function lookupPatientMedication(){
 const input=document.querySelector('#patientMedQ'),host=document.querySelector('#patientMedResult'),term=(input?.value||'').trim();
 if(!term){host.innerHTML='<div class="notice">Enter a medication name first.</div>';return}
 host.innerHTML='<div class="patient-med-card"><b>Searching medication references…</b></div>';
 try{
   const rx=await fetch('https://rxnav.nlm.nih.gov/REST/approximateTerm.json?term='+encodeURIComponent(term)+'&maxEntries=6');
   if(!rx.ok)throw new Error('RxNorm lookup unavailable');
   const rj=await rx.json(),cands=(rj.approximateGroup?.candidate||[]).filter(x=>x.rxcui);
   if(!cands.length){host.innerHTML='<div class="notice"><b>No close medication match found.</b><br>Check the spelling or try the generic/brand name printed on the bottle.</div>';return}
   host.innerHTML='<div class="patient-med-card"><h3>Possible matches</h3><div class="tool-note">Select the medication that matches the patient\'s bottle or medication list.</div><div class="patient-med-candidates">'+cands.map((x,i)=>'<button class="patient-med-choice" onclick="loadPatientMedication(\''+String(x.rxcui).replace(/'/g,'')+'\',\''+esc(String(x.name||term)).replace(/'/g,'&#39;')+'\')">'+esc(x.name||term)+(i===0?' <small>— closest match</small>':'')+'</button>').join('')+'</div></div>';
 }catch(e){
   host.innerHTML='<div class="notice"><b>Medication lookup requires an internet connection.</b><br>The PVFire protocol content can still work from its offline cache.</div>';
 }
}
async function loadPatientMedication(rxcui,fallbackName){
 const host=document.querySelector('#patientMedResult');host.innerHTML='<div class="patient-med-card"><b>Loading medication summary…</b></div>';
 let props=null,label=null,ingredientName='';
 try{const p=await fetch('https://rxnav.nlm.nih.gov/REST/rxcui/'+encodeURIComponent(rxcui)+'/properties.json');if(p.ok)props=(await p.json()).properties||null}catch(e){}
 const name=props?.name||fallbackName||'Medication';
 async function getLabel(search){
  try{const r=await fetch('https://api.fda.gov/drug/label.json?search='+encodeURIComponent(search)+'&limit=1');if(r.ok)return (await r.json()).results?.[0]||null}catch(e){}
  return null;
 }
 // An RxNorm search can return an ingredient-level concept (for example, losartan).
 // openFDA labels are usually product-level, so use progressively broader label matching.
 label=await getLabel('openfda.rxcui:"'+rxcui+'"');
 if(!label)label=await getLabel('openfda.generic_name:"'+name+'"');
 if(!label)label=await getLabel('openfda.substance_name:"'+name+'"');
 if(!label){
  try{
   const rel=await fetch('https://rxnav.nlm.nih.gov/REST/rxcui/'+encodeURIComponent(rxcui)+'/related.json?tty=IN+PIN');
   if(rel.ok){
    const groups=(await rel.json()).relatedGroup?.conceptGroup||[];
    const ing=groups.flatMap(g=>g.conceptProperties||[]).find(v=>v?.name);
    ingredientName=ing?.name||'';
   }
  }catch(e){}
  if(ingredientName)label=await getLabel('openfda.substance_name:"'+ingredientName+'"');
 }
 const brand=(label?.openfda?.brand_name||[]).join(', ');
 const generic=(label?.openfda?.generic_name||[]).join(', ');
 const classParts=[...(label?.openfda?.pharm_class_epc||[]),...(label?.openfda?.pharm_class_cs||[])].map(v=>String(v).replace(/\s*\[[^\]]+\]\s*$/,'').trim()).filter(Boolean);
 const drugClass=[...new Set(classParts)].join(' • ')||'Drug class information was not available from the matched FDA label.';
 const moaParts=[...(label?.openfda?.pharm_class_moa||[])].map(v=>String(v).replace(/\s*\[[^\]]+\]\s*$/,'').trim()).filter(Boolean);
 const mechanism=patientMedTrim(label?.mechanism_of_action||(moaParts.length?moaParts.join(' • '):'Mechanism of action was not available from the matched FDA label.'),700);
 const indication=patientMedTrim(label?.indications_and_usage||label?.purpose||'Indication information was not available from the matched FDA label.',800);
 const dailymed='https://dailymed.nlm.nih.gov/dailymed/search.cfm?query='+encodeURIComponent(name);
 const rxnav='https://mor.nlm.nih.gov/RxNav/search?searchBy=RXCUI&searchTerm='+encodeURIComponent(rxcui);
 host.innerHTML='<div class="patient-med-card"><h3>'+esc(name)+'</h3>'
   +(generic?'<div class="meta"><b>Generic:</b> '+esc(generic)+'</div>':'')
   +(brand?'<div class="meta"><b>Brand:</b> '+esc(brand)+'</div>':'')
   +'<div class="patient-med-label">Drug class</div><div class="patient-med-copy">'+esc(drugClass)+'</div>'
   +'<div class="patient-med-label">Mechanism of action</div><div class="patient-med-copy">'+esc(mechanism)+'</div>'
   +'<div class="patient-med-label">What it is prescribed for</div><div class="patient-med-copy">'+esc(indication)+'</div>'
   +'<div class="patient-med-links"><a class="patient-med-link" target="_blank" rel="noopener" href="'+dailymed+'">Detailed FDA / DailyMed Info ↗</a><a class="patient-med-link" target="_blank" rel="noopener" href="'+rxnav+'">RxNorm Drug Record ↗</a></div>'
   +'<div class="patient-med-warning" style="margin-top:12px"><b>Field reference:</b> This section is for identifying and understanding a patient\'s home medication. It is not a treatment recommendation. Follow PVFire protocols and Medical Control for EMS care.</div></div>';
}

function calcDopamine(){

function formatLucasProcedure(x){

async function load(){try{let r=await fetch('protocols.json',{cache:'no-store'});if(!r.ok)throw 0;data=await r.json()}catch(e){let r=await caches.match('protocols.json');if(r)data=await r.json()}roleUI();tabs();render();let dates=data.map(x=>x.updated).filter(Boolean).sort();document.querySelector('#ver').textContent=`${dates.length?'Current through '+dates.at(-1):'2026'} • Offline-ready`;if(location.hash)openP(location.hash.slice(1))}load();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
