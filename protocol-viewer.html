<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PVFIRE Source Protocol</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f4f5;color:#18181b}
header{background:#991b1b;color:white;padding:12px 14px;position:sticky;top:0;z-index:2}
h1{font-size:17px;margin:0}.sub{font-size:12px;opacity:.85;margin-top:3px}
main{max-width:900px;margin:auto;padding:10px}.bar{display:flex;gap:8px;margin-bottom:10px}
button{border:0;border-radius:9px;padding:10px 12px;font-weight:800}.back{background:#27272a;color:white}
#status{padding:20px;text-align:center;color:#52525b}.page{background:white;border-radius:10px;overflow:hidden;border:1px solid #ddd}
canvas{display:block;width:100%;height:auto}
.notice{font-size:12px;color:#52525b;margin:9px 2px;line-height:1.35}
</style></head><body>
<header><h1 id="title">PVFIRE Source Protocol</h1><div class="sub" id="pageLabel"></div></header>
<main><div class="bar"><button class="back" onclick="history.back()">‹ Back to Protocol</button></div>
<div id="status">Loading source page…</div><div class="page"><canvas id="pdf"></canvas></div>
<div class="notice">This view intentionally displays only the source page applicable to the selected protocol, not the entire protocol book.</div></main>
<script type="module">
const q=new URLSearchParams(location.search),src=q.get('src'),page=Math.max(1,parseInt(q.get('page')||'1',10)),title=q.get('title')||'PVFIRE Source Protocol';
document.querySelector('#title').textContent=title;document.querySelector('#pageLabel').textContent='Source page '+page;
try{
 const pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/+esm');
 pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
 const doc=await pdfjs.getDocument(src).promise,p=await doc.getPage(page),base=p.getViewport({scale:1});
 const width=Math.min(900,Math.max(320,document.querySelector('main').clientWidth-20)),scale=width/base.width,view=p.getViewport({scale});
 const c=document.querySelector('#pdf'),ctx=c.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);
 c.width=Math.floor(view.width*dpr);c.height=Math.floor(view.height*dpr);c.style.width=view.width+'px';c.style.height=view.height+'px';
 await p.render({canvasContext:ctx,viewport:view,transform:dpr===1?null:[dpr,0,0,dpr,0,0]}).promise;
 document.querySelector('#status').style.display='none';
}catch(e){document.querySelector('#status').innerHTML='<b>Unable to render this source page.</b><br>Return to the protocol and use the quick-reference text.'}
</script></body></html>
